# Cabeceras de caché
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- URL canónica única -------------------------------------------------
# Netlify servía cada página con y sin ".html", las dos con 200.
# El canonical, el sitemap y todos los enlaces internos usan ".html",
# así que la versión sin extensión redirige 301 a la versión con ".html".

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 301
  force = true

